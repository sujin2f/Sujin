query ListPost($type: ARCHIVE_TYPE!, $page: Int!, $slug: String!) {
    posts(type: $type, slug: $slug, page: $page) {
        items {
            _id
            title
            link
            id
            slug
            excerpt
            date
            images {
                list {
                    width
                    height
                    url
                    mimeType
                    sizes {
                        thumbnail {
                            width
                            height
                            url
                            mimeType
                        }
                    }
                }
                thumbnail {
                    width
                    height
                    url
                    mimeType
                    sizes {
                        thumbnail {
                            width
                            height
                            url
                            mimeType
                        }
                    }
                }
            }
            archives {
                _id
                title
                slug
                type
            }
        }
        numPages
    }
}
