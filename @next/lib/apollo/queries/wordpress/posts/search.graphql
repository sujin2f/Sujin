query Search($keyword: String!, $page: Int!) {
    search(keyword: $keyword, page: $page) {
        items {
            _id
            title
            link
            id
            slug
            excerpt
            date
            images {
                list {
                    width
                    height
                    url
                    mimeType
                    sizes {
                        thumbnail {
                            width
                            height
                            url
                            mimeType
                        }
                    }
                }
                thumbnail {
                    width
                    height
                    url
                    mimeType
                    sizes {
                        thumbnail {
                            width
                            height
                            url
                            mimeType
                        }
                    }
                }
            }
            archives {
                _id
                title
                slug
                type
            }
        }
        numPages
    }
}
