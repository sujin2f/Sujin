services:
    graphql:
        container_name: graphql-${VERSION}
        image: sujin2f/graphql:${VERSION}
        restart: always
        ports:
            - ${SERVER_PORT}:3000
        environment:
            MONGO: mongo
            MYSQL: mysql
        networks:
            - private

volumes:
    mongo:

# TODO prod secure network
networks:
    private:
        external: true
