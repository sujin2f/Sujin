type Query {
    focusBookmarks: [FocusMessage]
}
type Mutation {
    createFocusBookmark(message: FocusMessageInput!): String
    removeFocusBookmark(id: String!): [FocusMessage]
}

type FocusMessage {
    _id: String
    key: String
    title: String
    device: String
    type: String
    machineId: String
    message: String
}

input FocusMessageInput {
    key: String
    title: String
    device: String
    machineId: String
    type: String
    message: String
}
