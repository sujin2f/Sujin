query {
    post(slug: "?") {
        title
    }
    posts(type: category, slug: "?", page: 1) {
        items {
            title
        }
        numPages
    }
    postsAdmin(slug: "?", page: 1) {
        title
    }
    postsAllAdmin(page: 1) {
        title
    }
    search(keyword: "?", page: 1) {
        items {
            title
        }
        numPages
    }
    recent {
        title
    }
    prevNext(slug: "?") {
        title
    }
    related(page: 1) {
        title
    }
}
