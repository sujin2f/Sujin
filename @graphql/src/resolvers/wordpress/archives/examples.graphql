query {
    tagCloud {
        title
    }
    category(slug: "?") {
        title
    }
    categories(page: 1) {
        title
    }
    tag(slug: "?") {
        title
    }
    tags(page: 1) {
        title
    }
}

mutation {
    refreshHits(slug: "?")
    refreshCategory(slug: "?")
    removeCategory(slug: "?")
}
