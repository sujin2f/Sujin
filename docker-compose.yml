services:
    mongo:
        container_name: mongo
        image: mongo:5.0
        restart: always
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
            MONGO_USER: ${MONGO_USER}
            MONGO_PASSWORD: ${MONGO_PASSWORD}
            MONGO_DATABASE: ${MONGO_DATABASE}
        ports:
            - ${MONGO_PORT}:27017
        volumes:
            - mongo:/data/db

    mongo2:
        container_name: mongo2
        image: mongo:5.0
        restart: always
        ports:
            - 12345:27017
        environment:
            MONGO: mongo
        depends_on:
            - mongo

    mongo-test:
        container_name: mongo-test
        image: mongo:5.0
        restart: 'no'
        ports:
            - 27018:27017

    mysql:
        container_name: mysql
        image: mariadb:10.5
        restart: always
        environment:
            MYSQL_DATABASE: ${MYSQL_DB}
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
        ports:
            - 3306:3306

    sujin-graphql-prod:
        container_name: sujin-graphql
        build:
            dockerfile: Dockerfile.graphql
        restart: always
        ports:
            - 80:80
        environment:
            MONGO: host.docker.internal
            MYSQL: mysql
        depends_on:
            - mongo
            - mysql

volumes:
    mongo:
