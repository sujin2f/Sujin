query Page($slug: String!) {
    page(slug: $slug) {
        _id
        title
        link
        id
        slug
        excerpt
        date
        content
        images {
            icon {
                url
            }
            background {
                width
                height
                url
            }
            list {
                sizes {
                    mediumLarge {
                        width
                        height
                        url
                        mimeType
                    }
                }
            }
            thumbnail {
                sizes {
                    mediumLarge {
                        width
                        height
                        url
                        mimeType
                    }
                }
            }
        }
    }
}
