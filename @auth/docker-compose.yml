services:
    sujin_auth:
        container_name: sujin_auth
        image: sujin2f/auth:${VERSION}
        restart: always
        environment:
            CORS_ORIGINS: ${CORS_ORIGINS}
        ports:
            - ${SERVER_PORT}:${SERVER_PORT}
        networks:
            - sujin_public
            - sujin_graphql

networks:
    sujin_public:
        external: true
        internal: false
    sujin_graphql:
        external: true
        internal: true
