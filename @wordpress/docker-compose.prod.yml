# docker compose -f docker-compose.prod.yml up -d
services:
    sujin_wordpress:
        container_name: sujin_wordpress-${VERSION}
        image: sujin2f/wordpress:${VERSION}
        # restart: always
        environment:
            WORDPRESS_DB_HOST: sujin_mysql
            WORDPRESS_DB_NAME: ${MYSQL_DB}
            WORDPRESS_DB_USER: ${MYSQL_USER}
            WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
            WORDPRESS_DEBUG: 0
            TZ: America/Toronto
            ACCESS_SECRET: ${ACCESS_SECRET}
            GQL_ENDPOINT: ${GQL_ENDPOINT}
            VERSION: ${VERSION}
            ENV: ${ENV}
        ports:
            - ${SERVER_PORT}:80
        volumes:
            - ../@next/public/uploads:/var/www/html/wp-content/uploads
        networks:
            - sujin_public
            - sujin_wordpress

networks:
    sujin_public:
        external: true
        internal: false
    sujin_wordpress:
        external: true
        internal: true
